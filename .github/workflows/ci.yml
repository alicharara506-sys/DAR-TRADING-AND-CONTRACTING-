name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dar
          POSTGRES_PASSWORD: dar_secure_password
          POSTGRES_DB: dar_erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dar" --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx jest --ci
      - name: Migrations + seed against live PostgreSQL
        env:
          DATABASE_URL: postgresql://dar:dar_secure_password@localhost:5432/dar_erp?schema=public
        run: |
          npx prisma migrate deploy
          npx ts-node prisma/seed.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
